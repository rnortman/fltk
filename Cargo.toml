[workspace]
members = [".", "crates/fltk-cst-core", "crates/fltk-parser-core", "crates/fltk-unparser-core", "crates/fltk-ast-core", "crates/fltk-fmt-cli"]
resolver = "2"

# Single writer for the regex engine.  fltk-parser-core compiles a grammar's terminals for
# anchored prefix matching and fltk-ast-core compiles the same terminals for full-match
# validation, so the two must agree on version *and* feature set: a pattern the generated
# parser accepts has to compile in the AST layer too.  Two hand-maintained copies of the pin
# would drift with no diagnostic, so members inherit it with `workspace = true`.
[workspace.dependencies]
regex-automata = { version = "0.4", default-features = false, features = [
    "std",
    "syntax",
    "perf",
    "unicode",
    "meta",
    "nfa-backtrack",
    "nfa-pikevm",
    "hybrid",
    "dfa-onepass",
] }

[package]
name = "fltk-native"
version = "0.4.0"
edition = "2021"
# Ships to PyPI via maturin, not crates.io. Guards against accidental `cargo publish`
# and exempts this crate from cargo-deny license enforcement ([licenses.private]).
publish = false

[lib]
name = "fltk_native"
crate-type = ["cdylib"]

[features]
default = ["extension-module"]
extension-module = ["python", "pyo3/extension-module"]
python = ["fltk-cst-core/python"]
test-introspection = ["python", "fltk-cst-core/test-introspection"]

[dependencies]
pyo3 = { version = "0.29", features = ["abi3-py310"] }
fltk-cst-core = { path = "crates/fltk-cst-core", default-features = false }
