[package]
name = "fltk-ast-core"
version = "0.4.0"
edition = "2021"
license = "MIT"

[lib]
name = "fltk_ast_core"
crate-type = ["rlib"]

# No `python` feature: pyo3-freedom is structural absence, not a disabled feature.
# This crate never links pyo3.
#
# regex-automata is taken directly rather than reached through fltk-parser-core's
# re-export: generated AST code never names a regex type — terminal patterns are
# compiled and matched behind `TerminalPattern` — so there is no generated-code/runtime
# version pair to keep coherent, which is what that re-export exists for.  The version
# and feature pin it shares with fltk-parser-core lives in the workspace manifest.
[dependencies]
fltk-cst-core = { path = "../fltk-cst-core", default-features = false }
indexmap = { version = "2", optional = true }
# The two opt-in scalar builtins. Both are taken without default features: `uuid`'s
# generators and `rust_decimal`'s serde support are no part of parsing a lexeme or
# rendering a value back to one.
uuid = { version = "1", optional = true, default-features = false, features = ["std"] }
rust_decimal = { version = "1", optional = true, default-features = false, features = [
    "std",
] }
regex-automata = { workspace = true }

# The two scalar builtins again, unconditionally. The crate's own feature-gated tests use
# both, and a dev-dependency is always active in the workspace resolve — which is what gives
# the Bazel lane's `crate.from_cargo` hub a target for each, so
# `crates/fltk-ast-core/BUILD.bazel` can turn the features on. Every field mirrors the
# optional declaration above, and `tests/test_ast_core_manifest.py` fails if the two drift:
# a Bazel build would then compile a different version or feature set than a Cargo build of
# the same feature.
[dev-dependencies]
uuid = { version = "1", default-features = false, features = ["std"] }
rust_decimal = { version = "1", default-features = false, features = [
    "std",
] }

[features]
default = ["indexmap"]
# indexmap (default-on): the container a `key:` keyed collection generates. Generated
# code names `::fltk_ast_core::IndexMap`, so a consumer whose sidecar uses no `key:`
# statement can drop the dependency with `default-features = false`.
indexmap = ["dep:indexmap"]
# uuid / decimal: the two `type:` builtins whose value is not a primitive. Off by default
# so a consumer using neither pays for neither; a generated module that needs one names
# the feature in its header comment.
uuid = ["dep:uuid"]
decimal = ["dep:rust_decimal"]
