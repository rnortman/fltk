[package]
name = "fltk-cst-core"
version = "0.4.0"
edition = "2021"
license = "MIT"

[lib]
name = "fltk_cst_core"
crate-type = ["rlib"]

# `python` feature (opt-in): activates pyo3 linkage, #[pyclass]/#[pymethods], and
# cross-cdylib helpers. A cdylib crate enables it explicitly, usually by forwarding its own
# `python` feature (see docs/rust-cst-extension-guide.md). Pure-Rust consumers get no pyo3
# without asking for it, which is why the feature is not in `default`: a silent pyo3 edge in
# a build that wanted none is invisible until link time. The cquery loop in `make bazel-test`
# asserts the default graph stays clean.
[dependencies]
pyo3 = { version = "0.29", features = ["abi3-py310"], optional = true }

[features]
default = []
python = ["dep:pyo3"]
# test-introspection: enables registry introspection helpers (snapshot) for test fixture crates.
# Never enable in production extensions — test-only plumbing.
test-introspection = ["python"]
