name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # No Rust toolchain is installed here: the Bazel lanes fetch their own hermetic one,
      # pinned by the rust.toolchain tag in MODULE.bazel, and nothing in the gate runs cargo.

      # Performance-only: a shared disk cache lets the consumer lane reuse
      # crate artifacts the root lane built instead of recompiling cold.
      # The toolchain pin lives in MODULE.bazel, not the lock, so both
      # MODULE.bazel files join every tracked lock in the cache key — including
      # each workspace's cargo-bazel-lock.json, which is what decides the
      # third-party crate versions the cached artifacts were built from.
      # Correctness does not depend on a hit.
      - name: Configure shared Bazel disk cache
        run: |
          mkdir -p "$HOME/.cache/bazel-disk"
          printf 'common --disk_cache=%s/.cache/bazel-disk\n' "$HOME" >> "$HOME/.bazelrc"

      - name: Cache Bazel disk cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/bazel-disk
          key: bazel-${{ runner.os }}-${{ hashFiles('.bazelversion', 'MODULE.bazel', 'tests/bazel_consumer/MODULE.bazel', 'MODULE.bazel.lock', 'tests/bazel_consumer/MODULE.bazel.lock', 'cargo-bazel-lock.json', 'tests/bazel_consumer/cargo-bazel-lock.json') }}
          restore-keys: |
            bazel-${{ runner.os }}-

      # check-ci is an alias for check: the two lanes no longer differ.
      - name: Run checks
        run: make check-ci

      # --test_output=errors puts a failing target's log in the step output above, which covers
      # the common case.  This covers what it cannot: multi-megabyte logs, the test.xml files,
      # and undeclared outputs, none of which survive the runner.  bazel-testlogs is a
      # convenience symlink, so each workspace's tree is resolved and copied; the consumer lane
      # is its own workspace and has its own.  `bazel info` reuses the running server and
      # rebuilds nothing.
      #
      # Each copy is independent and best-effort.  The step runs under `bash -e`, and a failure
      # of the root copy — the tree does not exist because the run died before any root test
      # ran, or `cp -rL` returns nonzero on a dangling link inside a partially-written
      # test.outputs directory — would otherwise take the consumer lane's logs down with it,
      # and the consumer lane is where a whole workspace's evidence lives.  A partial tree is
      # still worth uploading, so a nonzero copy is not allowed to end the step.
      - name: Collect Bazel test logs
        if: failure()
        continue-on-error: true
        run: |
          mkdir -p testlogs-artifact
          root="$(bazel info bazel-testlogs || true)"
          [ -n "$root" ] && cp -rL "$root" testlogs-artifact/root || true
          consumer="$(cd tests/bazel_consumer && bazel info bazel-testlogs || true)"
          [ -n "$consumer" ] && cp -rL "$consumer" testlogs-artifact/consumer || true
          find testlogs-artifact -maxdepth 1

      - name: Upload Bazel test logs
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: bazel-testlogs
          path: testlogs-artifact
          if-no-files-found: ignore

      # Bazel's disk cache has no eviction of its own, and the restore-keys prefix
      # makes every key change layer a fresh generation of artifacts (new toolchain,
      # new crate versions) on top of the previous cache, so the archive would grow
      # monotonically until it evicts itself from the repository cache quota — cold
      # Bazel builds at unpredictable times, the opposite of what the cache is for.
      # Keep the most recently used ~2 GiB.  Runs before the cache action's post-job
      # save (post steps run after all normal steps).
      - name: Prune Bazel disk cache
        if: always()
        continue-on-error: true
        run: |
          cache_dir="$HOME/.cache/bazel-disk"
          max_bytes=$((2 * 1024 * 1024 * 1024))
          [ -d "$cache_dir" ] || exit 0
          before=$(du -sh "$cache_dir" | cut -f1)
          find "$cache_dir" -type f -printf '%T@\t%s\t%p\n' | sort -rn | {
            total=0
            while IFS=$(printf '\t') read -r _ size path; do
              total=$((total + size))
              if [ "$total" -gt "$max_bytes" ]; then
                rm -f "$path"
              fi
            done
          }
          echo "Bazel disk cache: $before before prune, $(du -sh "$cache_dir" | cut -f1) after"
