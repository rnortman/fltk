version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  # There is no Rust updater.  The toolchain pin lives in every MODULE.bazel's
  # rust.toolchain tag and the third-party crates in the root MODULE.bazel's crate.spec
  # list, neither of which any ecosystem here understands; both are bumped by hand (edit,
  # repin, `make check`) — see TODO(rust-supply-chain-audit).

  # requirements.in + requirements_lock.txt — the Python dependency surface that feeds the
  # Bazel pip hub.  Complete a bump PR by running `bazel run //:requirements.update` on the
  # branch; //:requirements.test fails until the lock matches the manifest.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
