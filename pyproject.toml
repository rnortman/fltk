# Tool configuration only.  fltk is built, tested and packaged by Bazel: there is no
# [project] table, no [build-system], and no dependency tables here.  The Python
# dependency manifest is requirements.in (compiled to requirements_lock.txt by
# `bazel run //:requirements.update`), and every CLI is a py_binary rather than a
# console entry point.

[tool.pyright]
pythonVersion = "3.10"
include = ["fltk", "*.py", "tests/typecheck_fegen_cst_conformance.py"]
exclude = ["**/__pycache__"]
stubPath = ""
extraPaths = ["crates/fegen-rust"]

[tool.ruff]
# Codegen actions pass gencode-ruff.toml directly (--config) so generated
# output never depends on config discovery.  Repo-local-only settings go below;
# anything that shapes emitted code belongs in gencode-ruff.toml.
extend = "gencode-ruff.toml"

[tool.ruff.lint.per-file-ignores]
# Tests can use magic values, assertions, and relative imports
"tests/**/*" = ["PLR2004", "S101", "TID252"]
"**/test_*.py" = ["PLR2004", "S101", "TID252"]
# CLI files can use boolean arguments as they are command-line options
"genparser.py" = ["FBT002"]
# Generated type stubs keep each method on one `...`-bodied line (typeshed/stub
# convention; ruff's formatter does not wrap these), so long signatures are expected.
"*.pyi" = ["E501"]

[tool.coverage.run]
source_pkgs = ["fltk"]
branch = true
omit = [
  "src/fltk/__about__.py",
]

[tool.coverage.paths]
fltk = ["fltk", "*/fltk/src/fltk"]
tests = ["fltk", "*/fltk"]

[tool.coverage.report]
exclude_lines = [
  "no cov",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]
