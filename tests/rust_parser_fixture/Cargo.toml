[workspace]

[package]
name = "rust-parser-fixture"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "rust_parser_fixture"
crate-type = ["rlib", "cdylib"]

[features]
python = ["dep:pyo3", "fltk-cst-core/python"]
extension-module = ["python", "pyo3/extension-module"]
test-introspection = ["python", "fltk-cst-core/test-introspection"]

[dependencies]
# The two wide scalar features: `ast.rs` names `::fltk_ast_core::Uuid` and `::Decimal`,
# which the runtime re-exports only under them.
fltk-ast-core = { path = "../../crates/fltk-ast-core", features = ["uuid", "decimal"] }
fltk-cst-core = { path = "../../crates/fltk-cst-core", default-features = false }
fltk-parser-core = { path = "../../crates/fltk-parser-core" }
fltk-serde-core = { path = "../../crates/fltk-serde-core" }
fltk-unparser-core = { path = "../../crates/fltk-unparser-core" }
pyo3 = { version = "0.29", features = ["abi3-py310"], optional = true }
# `de.rs` names serde's traits and nothing else; with fltk-serde-core these are the two
# entries a consumer of the serde frontend adds.  `derive` is a test-only need — the
# #[derive(Deserialize)] targets exercising the module live in de_tests.rs.
serde = "1"

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
